# Render Blueprint for the two ASP.NET Core demo apps in this repo.
# Deploy: Render Dashboard -> New -> Blueprint -> connect this repo -> Deploy Blueprint.
# Free plan: services sleep after 15 minutes idle and take about a minute to wake;
# the filesystem is temporary, so each app reseeds its demo data on startup.
# DemoAdmin__Password is asked for once, in the dashboard, when the Blueprint is created.
# Field reference: https://render.com/docs/blueprint-spec

services:
  - type: "web"
    name: "it-asset-service-request-tracker"
    runtime: "docker"
    plan: "free"
    region: "oregon"
    dockerfilePath: "./apps/it-asset-service-request-tracker/Dockerfile"
    dockerContext: "./apps/it-asset-service-request-tracker"
    healthCheckPath: "/api/health"
    autoDeployTrigger: "commit"
    buildFilter:
      paths:
        - "apps/it-asset-service-request-tracker/**"
    envVars:
      - key: "PORT"
        value: "10000"
      - key: "ASPNETCORE_FORWARDEDHEADERS_ENABLED"
        value: "true"
  - type: "web"
    name: "movie-theater-ticket-system"
    runtime: "docker"
    plan: "free"
    region: "oregon"
    dockerfilePath: "./apps/movie-theater-ticket-system/Dockerfile"
    dockerContext: "./apps/movie-theater-ticket-system"
    healthCheckPath: "/healthz"
    autoDeployTrigger: "commit"
    buildFilter:
      paths:
        - "apps/movie-theater-ticket-system/**"
    envVars:
      - key: "PORT"
        value: "10000"
      - key: "ASPNETCORE_FORWARDEDHEADERS_ENABLED"
        value: "true"
      - key: "Theater__TimeZone"
        value: "America/Los_Angeles"
      - key: "DemoAdmin__Password"
        sync: false
