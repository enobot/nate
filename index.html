<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Page-specific tags (title, description, canonical, Open Graph) are
         inserted here: by vite.config.js for the home page, and per page by
         scripts/prerender.mjs at build time. -->
    <!--app-head-->
    <meta name="author" content="Nathanael Haig" />
    <meta name="theme-color" content="#05060a" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta property="og:site_name" content="Nathanael Haig" />
    <meta property="og:locale" content="en_US" />
    <meta property="profile:first_name" content="Nathanael" />
    <meta property="profile:last_name" content="Haig" />
    <meta name="twitter:card" content="summary" />
    <!-- Lets CSS know JavaScript is running, so scroll-reveal effects only
         hide content when they can also show it again. -->
    <script>document.documentElement.classList.add("js");</script>

    <!-- Structured data for search engines -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Nathanael Haig",
        "url": "%VITE_SITE_URL%/",
        "jobTitle": "IT Telecommunications Student Assistant",
        "description": "Information Systems student at California State University, Fullerton supporting the CSUF IT Telecommunications network analyst team.",
        "worksFor": {
          "@type": "CollegeOrUniversity",
          "name": "California State University, Fullerton"
        },
        "alumniOf": {
          "@type": "CollegeOrUniversity",
          "name": "California State University, Fullerton"
        },
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Fullerton",
          "addressRegion": "CA",
          "addressCountry": "US"
        },
        "knowsAbout": [
          "Network troubleshooting",
          "VLAN assignment",
          "Switch port activation",
          "IT support",
          "ServiceNow",
          "SQL",
          "Information systems"
        ],
        "sameAs": ["https://www.linkedin.com/in/nah28"]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="max-width: 40rem; margin: 3rem auto; padding: 0 1rem; color: #e8ebf5; font-family: system-ui, sans-serif; line-height: 1.6">
        <p>
          Some interactive parts of this portfolio need JavaScript. You can still reach Nathanael by
          <a style="color: #7cf3ff" href="mailto:nathanaelahaig@gmail.com">email</a> or on
          <a style="color: #7cf3ff" href="https://www.linkedin.com/in/nah28">LinkedIn</a>.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
