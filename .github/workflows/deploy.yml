name: Deploy to GitHub Pages

# Pushes to main: test, build, and deploy.
# Pull requests into main: test and build only (nothing is deployed), so
# problems show up on the pull request before it's merged.
on:
  push:
    branches: [main]
    # Changes that only touch the project apps don't change the portfolio site.
    paths-ignore:
      - "apps/**"
      - ".github/workflows/ops-app.yml"
      - ".github/workflows/toolkit.yml"
  pull_request:
    branches: [main]
    paths-ignore:
      - "apps/**"
      - ".github/workflows/ops-app.yml"
      - ".github/workflows/toolkit.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Deploys share one queue; each pull request gets its own.
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - id: pages
        uses: actions/configure-pages@v6
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          VITE_SITE_URL: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
