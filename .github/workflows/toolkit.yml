name: Network toolkit tests

# Runs the Network Diagnostics Toolkit's Pester tests on Windows PowerShell 5.1 and
# PowerShell 7, plus PSScriptAnalyzer, whenever the toolkit's folder changes.
on:
  push:
    branches: [main]
    paths:
      - "apps/network-diagnostics-toolkit/**"
      - ".github/workflows/toolkit.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/network-diagnostics-toolkit/**"
      - ".github/workflows/toolkit.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/network-diagnostics-toolkit

jobs:
  pester-windows-powershell:
    name: Pester on Windows PowerShell 5.1
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Show PowerShell version
        shell: powershell
        run: $PSVersionTable | Format-Table -AutoSize

      - name: Install Pester 6.2.0
        shell: powershell
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Scope CurrentUser -Force | Out-Null
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -RequiredVersion 6.2.0 -Scope CurrentUser -Force -SkipPublisherCheck -AllowClobber
          Get-Module -ListAvailable -Name Pester | Format-Table Name, Version, Path -AutoSize

      - name: Run unit and integration tests
        shell: powershell
        run: ./tools/Invoke-Tests.ps1 -CI

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pester-windows-powershell-5.1
          path: apps/network-diagnostics-toolkit/TestResults/

  pester-powershell-7:
    name: Pester on PowerShell 7
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Show PowerShell version
        shell: pwsh
        run: $PSVersionTable | Format-Table -AutoSize

      - name: Install Pester 6.2.0
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -RequiredVersion 6.2.0 -Scope CurrentUser -Force -SkipPublisherCheck -AllowClobber
          Get-Module -ListAvailable -Name Pester | Format-Table Name, Version, Path -AutoSize

      - name: Run unit and integration tests
        shell: pwsh
        run: ./tools/Invoke-Tests.ps1 -CI

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pester-powershell-7
          path: apps/network-diagnostics-toolkit/TestResults/

  script-analyzer:
    name: PSScriptAnalyzer
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install PSScriptAnalyzer 1.25.0
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force

      - name: Analyze module, entry script and tools
        shell: pwsh
        run: |
          $settings = './PSScriptAnalyzerSettings.psd1'
          $findings = @()
          $findings += Invoke-ScriptAnalyzer -Path ./src -Recurse -Settings $settings
          $findings += Invoke-ScriptAnalyzer -Path ./Start-NetworkToolkit.ps1 -Settings $settings
          $findings += Invoke-ScriptAnalyzer -Path ./tools -Recurse -Settings $settings
          $findings | Format-Table -Property Severity, RuleName, ScriptName, Line, Message -AutoSize -Wrap
          if ($findings.Count -gt 0) { throw "PSScriptAnalyzer reported $($findings.Count) finding(s)." }
          'PSScriptAnalyzer: no findings.'
